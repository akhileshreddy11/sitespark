[project]
name = "sitespark"
version = "0.1.0"
description = "Phase 1 local-business lead discovery and enrichment"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<6.0",
  "playwright>=1.48,<2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
